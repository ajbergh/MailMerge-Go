<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MailMerge Go application icon</title>
  <desc id="desc">A layered white envelope with a cyan merge symbol on a rounded blue square.</desc>

  <defs>
    <linearGradient id="tile" x1="152" y1="112" x2="872" y2="920" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.46" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <radialGradient id="tileGlow" cx="0" cy="0" r="1" gradientTransform="translate(274 210) rotate(49) scale(730)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="merge" x1="697" y1="169" x2="850" y2="339" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3FC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="envelopeFace" x1="512" y1="337" x2="512" y2="769" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#07152F" flood-opacity="0.34"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#0F2F73" flood-opacity="0.32"/>
    </filter>
    <filter id="badgeShadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0C4A6E" flood-opacity="0.38"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="48" y="48" width="928" height="928" rx="224"/>
    </clipPath>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="48" y="48" width="928" height="928" rx="224" fill="url(#tile)"/>
  </g>
  <g clip-path="url(#tileClip)">
    <rect x="48" y="48" width="928" height="928" fill="url(#tileGlow)"/>
    <circle cx="192" cy="167" r="205" fill="#FFFFFF" fill-opacity="0.06"/>
    <path d="M33 846C243 737 403 758 602 873C710 935 847 967 1039 895V1039H33V846Z" fill="#071D47" fill-opacity="0.16"/>
  </g>

  <!-- Stacked messages make the merge concept visible without adding small text. -->
  <g opacity="0.42">
    <rect x="244" y="251" width="584" height="389" rx="72" fill="#CFFAFE" transform="rotate(7 244 251)"/>
    <rect x="194" y="275" width="584" height="389" rx="72" fill="#DBEAFE" transform="rotate(-7 194 275)"/>
  </g>

  <!-- Primary envelope. -->
  <g filter="url(#cardShadow)">
    <rect x="188" y="306" width="648" height="456" rx="82" fill="url(#envelopeFace)"/>
    <path d="M226 372L471 568C495 587 529 587 553 568L798 372" fill="#DDEBFF"/>
    <path d="M226 372L471 568C495 587 529 587 553 568L798 372" stroke="#2563EB" stroke-width="50" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M226 700L424 527" stroke="#BBD7FF" stroke-width="38" stroke-linecap="round"/>
    <path d="M798 700L600 527" stroke="#BBD7FF" stroke-width="38" stroke-linecap="round"/>
  </g>

  <!-- Merge badge, matching the README banner identity. -->
  <g filter="url(#badgeShadow)">
    <circle cx="785" cy="263" r="111" fill="#0B2553" fill-opacity="0.22"/>
    <circle cx="775" cy="251" r="102" fill="url(#merge)" stroke="#FFFFFF" stroke-width="14"/>
    <path d="M775 197V305M721 251H829" stroke="#083F64" stroke-width="31" stroke-linecap="round"/>
  </g>
</svg>

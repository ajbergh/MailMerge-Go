<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">MailMerge Go — personalized Outlook campaigns, safely sent</title>
  <desc id="desc">A promotional banner showing the MailMerge Go workflow from spreadsheet contacts through a personalized email editor, campaign preflight, and Outlook delivery.</desc>

  <defs>
    <linearGradient id="background" x1="112" y1="38" x2="1442" y2="702" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07152F"/>
      <stop offset="0.48" stop-color="#0B2553"/>
      <stop offset="1" stop-color="#0A1632"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0" cy="0" r="1" gradientTransform="translate(1188 342) rotate(164) scale(652 488)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB" stop-opacity="0.48"/>
      <stop offset="0.58" stop-color="#2563EB" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="112" y1="146" x2="422" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.45" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="windowBar" x1="762" y1="107" x2="1490" y2="203" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="progress" x1="1052" y1="0" x2="1420" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#93C5FD" fill-opacity="0.14"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#020617" flood-opacity="0.46"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.25"/>
    </filter>
    <filter id="iconGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bannerClip"><rect width="1600" height="720" rx="32"/></clipPath>
    <clipPath id="appClip"><rect x="751" y="99" width="739" height="520" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <rect width="1600" height="720" fill="url(#background)"/>
    <rect width="1600" height="720" fill="url(#dotGrid)"/>
    <rect width="1600" height="720" fill="url(#blueGlow)"/>
    <path d="M-48 585C274 470 432 512 680 663C824 751 1023 799 1322 720H-48V585Z" fill="#2563EB" fill-opacity="0.08"/>
    <path d="M1180 -105L1712 251V-105H1180Z" fill="#38BDF8" fill-opacity="0.05"/>
    <path d="M1460 20L1610 168" stroke="#60A5FA" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M1408 20L1608 218" stroke="#60A5FA" stroke-opacity="0.08" stroke-width="2"/>

    <!-- Brand lockup -->
    <g transform="translate(94 72)">
      <rect width="58" height="58" rx="15" fill="url(#brand)"/>
      <path d="M14 19.5L29 30.5L44 19.5" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="13.5" y="18" width="31" height="23" rx="5" stroke="white" stroke-width="3"/>
      <path d="M35 13L42 13M39 9L39 17" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
      <text x="76" y="25" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="0.2">MailMerge Go</text>
      <text x="76" y="47" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.2">WINDOWS DESKTOP</text>
    </g>

    <!-- Hero copy -->
    <g transform="translate(94 190)">
      <rect width="224" height="30" rx="15" fill="#172F58" stroke="#3B82F6" stroke-opacity="0.6"/>
      <circle cx="17" cy="15" r="4" fill="#4ADE80"/>
      <text x="30" y="20" fill="#BFDBFE" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">CLASSIC OUTLOOK READY</text>

      <text x="0" y="96" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-2.2">Personalized campaigns.</text>
      <text x="0" y="160" fill="url(#brand)" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="750" letter-spacing="-2.2">Safely sent.</text>

      <text x="2" y="213" fill="#C7D8F3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400">
        Import contacts, compose with smart merge fields, and send
      </text>
      <text x="2" y="242" fill="#C7D8F3" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400">
        through Outlook — with preflight checks at every campaign.
      </text>

      <!-- Feature chips -->
      <g transform="translate(0 286)" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
        <g>
          <rect width="136" height="42" rx="12" fill="#102A50" stroke="#365984"/>
          <path d="M17 12H27L33 18V30H17V12Z" stroke="#67E8F9" stroke-width="1.7" stroke-linejoin="round"/>
          <path d="M27 12V18H33M20 22H30M20 26H30" stroke="#67E8F9" stroke-width="1.5" stroke-linecap="round"/>
          <text x="44" y="26" fill="#E0F2FE">CSV + Excel</text>
        </g>
        <g transform="translate(148)">
          <rect width="157" height="42" rx="12" fill="#102A50" stroke="#365984"/>
          <path d="M16 16H20M28 16H32M19 13V19M29 13V19M19 26H29" stroke="#93C5FD" stroke-width="1.8" stroke-linecap="round"/>
          <text x="43" y="26" fill="#E0F2FE">Smart fields</text>
        </g>
        <g transform="translate(317)">
          <rect width="170" height="42" rx="12" fill="#102A50" stroke="#365984"/>
          <path d="M24 11L33 15V22C33 27 29.3 31 24 33C18.7 31 15 27 15 22V15L24 11Z" stroke="#4ADE80" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M20 22L23 25L29 19" stroke="#4ADE80" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="44" y="26" fill="#E0F2FE">Preflight guarded</text>
        </g>
      </g>

      <g transform="translate(0 356)">
        <path d="M0 11H40" stroke="#3B82F6" stroke-width="2"/>
        <circle cx="5" cy="11" r="5" fill="#60A5FA"/>
        <text x="54" y="16" fill="#8EABD2" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="500">Local-first • templates • attachments • live progress • retry failed</text>
      </g>
    </g>

    <!-- App window -->
    <g filter="url(#shadow)">
      <rect x="751" y="99" width="739" height="520" rx="20" fill="#F8FAFC"/>
      <g clip-path="url(#appClip)">
        <rect x="751" y="99" width="739" height="73" fill="url(#windowBar)"/>
        <circle cx="780" cy="121" r="5" fill="#BFDBFE" fill-opacity="0.55"/>
        <circle cx="798" cy="121" r="5" fill="#BFDBFE" fill-opacity="0.35"/>
        <circle cx="816" cy="121" r="5" fill="#BFDBFE" fill-opacity="0.22"/>
        <g transform="translate(778 139)">
          <path d="M0 4L8 10L16 4M1 3H15V14H1V3Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>
          <text x="25" y="13" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">MailMerge Go</text>
        </g>
        <g transform="translate(1324 137)">
          <circle cx="6" cy="6" r="5" fill="#4ADE80"/>
          <path d="M4 6L5.5 7.5L8.5 4.5" stroke="#064E3B" stroke-width="1.3" stroke-linecap="round"/>
          <text x="17" y="11" fill="#DCFCE7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Outlook connected</text>
        </g>

        <!-- Workflow rail -->
        <rect x="751" y="172" width="167" height="447" fill="#F1F5F9"/>
        <line x1="788" y1="232" x2="788" y2="390" stroke="#CBD5E1" stroke-width="2"/>
        <g font-family="Segoe UI, Arial, sans-serif">
          <circle cx="788" cy="218" r="16" fill="#2563EB"/>
          <path d="M780 218L786 224L797 212" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="816" y="216" fill="#0F172A" font-size="12" font-weight="700">Import contacts</text>
          <text x="816" y="232" fill="#64748B" font-size="10">248 selected</text>

          <circle cx="788" cy="294" r="16" fill="#2563EB"/>
          <path d="M782 287H795V299H782V287ZM785 284H798V296" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
          <text x="816" y="292" fill="#0F172A" font-size="12" font-weight="700">Compose</text>
          <text x="816" y="308" fill="#64748B" font-size="10">HTML email</text>

          <circle cx="788" cy="370" r="16" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
          <path d="M780 371L795 364L790 378L787 372L780 371Z" fill="#2563EB"/>
          <text x="816" y="368" fill="#0F172A" font-size="12" font-weight="700">Review &amp; send</text>
          <text x="816" y="384" fill="#2563EB" font-size="10" font-weight="600">Preflight ready</text>
        </g>
        <rect x="775" y="548" width="119" height="39" rx="9" fill="white" stroke="#CBD5E1"/>
        <path d="M790 566H800M795 561V571" stroke="#64748B" stroke-width="1.7" stroke-linecap="round"/>
        <text x="808" y="571" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">New merge</text>

        <!-- Editor canvas -->
        <text x="948" y="207" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Compose campaign</text>
        <text x="948" y="229" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="11">Spring customer check-in • 248 recipients</text>

        <text x="948" y="260" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.7">SUBJECT</text>
        <rect x="948" y="270" width="499" height="43" rx="8" fill="white" stroke="#CBD5E1"/>
        <text x="964" y="296" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="12">A quick update for </text>
        <rect x="1065" y="281" width="84" height="22" rx="6" fill="#DBEAFE"/>
        <text x="1075" y="296" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">first_name</text>

        <text x="948" y="340" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="0.7">MESSAGE</text>
        <rect x="948" y="350" width="499" height="151" rx="8" fill="white" stroke="#CBD5E1"/>
        <rect x="948" y="350" width="499" height="31" rx="8" fill="#F8FAFC"/>
        <path d="M948 381H1447" stroke="#E2E8F0"/>
        <text x="963" y="371" fill="#334155" font-family="Georgia, serif" font-size="12" font-weight="700">B</text>
        <text x="985" y="371" fill="#334155" font-family="Georgia, serif" font-size="12" font-style="italic">I</text>
        <path d="M1007 362H1021M1007 366H1021M1007 370H1017" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M1037 362H1051M1037 366H1051M1037 370H1051" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
        <rect x="1329" y="357" width="101" height="18" rx="6" fill="#EFF6FF"/>
        <text x="1340" y="370" fill="#2563EB" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="600">+ Insert merge field</text>
        <text x="964" y="411" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="12">Hi</text>
        <rect x="982" y="396" width="112" height="22" rx="6" fill="#DBEAFE"/>
        <text x="992" y="411" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">first_name|there</text>
        <text x="1097" y="411" fill="#334155" font-family="Segoe UI, Arial, sans-serif" font-size="12">,</text>
        <rect x="964" y="432" width="343" height="8" rx="4" fill="#E2E8F0"/>
        <rect x="964" y="449" width="405" height="8" rx="4" fill="#E2E8F0"/>
        <rect x="964" y="466" width="275" height="8" rx="4" fill="#E2E8F0"/>

        <!-- Footer actions -->
        <rect x="948" y="524" width="108" height="39" rx="9" fill="white" stroke="#CBD5E1"/>
        <path d="M965 544C971 537 982 537 988 544C982 551 971 551 965 544Z" stroke="#475569" stroke-width="1.5"/>
        <circle cx="976.5" cy="544" r="2.5" fill="#475569"/>
        <text x="998" y="549" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">Preview</text>
        <rect x="1068" y="524" width="112" height="39" rx="9" fill="#EFF6FF" stroke="#93C5FD"/>
        <path d="M1085 539L1093 544L1085 549V539Z" fill="#2563EB"/>
        <text x="1101" y="549" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Send test</text>
        <rect x="1298" y="524" width="149" height="39" rx="9" fill="#2563EB"/>
        <path d="M1315 545L1328 538L1324 551L1321 546L1315 545Z" fill="white"/>
        <text x="1335" y="549" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Review &amp; send</text>
      </g>
    </g>

    <!-- Floating preflight card -->
    <g filter="url(#softShadow)" transform="translate(1182 445)">
      <rect width="279" height="144" rx="16" fill="#FFFFFF" stroke="#DCE6F3"/>
      <g transform="translate(18 17)">
        <circle cx="17" cy="17" r="17" fill="#DCFCE7"/>
        <path d="M17 8L25 11.5V17.5C25 22 21.7 25.4 17 27C12.3 25.4 9 22 9 17.5V11.5L17 8Z" stroke="#16A34A" stroke-width="1.7"/>
        <path d="M13 17L16 20L21.5 14.5" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="46" y="14" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Campaign preflight passed</text>
        <text x="46" y="31" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="10">No blocking issues found</text>
      </g>
      <g transform="translate(18 68)" font-family="Segoe UI, Arial, sans-serif">
        <rect width="76" height="54" rx="9" fill="#F8FAFC"/>
        <text x="12" y="22" fill="#64748B" font-size="9" font-weight="600">RECIPIENTS</text>
        <text x="12" y="43" fill="#0F172A" font-size="17" font-weight="700">248</text>
        <rect x="84" width="76" height="54" rx="9" fill="#F8FAFC"/>
        <text x="96" y="22" fill="#64748B" font-size="9" font-weight="600">WARNINGS</text>
        <text x="96" y="43" fill="#0F172A" font-size="17" font-weight="700">0</text>
        <rect x="168" width="75" height="54" rx="9" fill="#F0FDF4"/>
        <text x="180" y="22" fill="#15803D" font-size="9" font-weight="600">READY</text>
        <text x="180" y="43" fill="#15803D" font-size="17" font-weight="700">100%</text>
      </g>
    </g>

    <!-- Delivery badge -->
    <g transform="translate(1418 73)" filter="url(#iconGlow)">
      <circle cx="40" cy="40" r="39" fill="#0B2553" stroke="#60A5FA" stroke-opacity="0.8"/>
      <rect x="20" y="23" width="40" height="34" rx="5" fill="#2563EB"/>
      <path d="M22 27L40 41L58 27" stroke="white" stroke-width="3" stroke-linejoin="round"/>
      <path d="M53 17L67 22L62 37L58 29L53 17Z" fill="#67E8F9"/>
    </g>

    <text x="1501" y="684" text-anchor="end" fill="#6C89B1" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.4">GO • REACT • WAILS</text>
  </g>
</svg>
